# Navigation Scenarios (25개)
# 웨이포인트 이동, GPS 좌표 도달, 경로 추종

metadata:
  category: navigation
  count: 25
  description: 기본 네비게이션 시나리오

scenarios:
  # === 단일 웨이포인트 이동 (5개) ===
  - id: nav_001
    name: 전방 웨이포인트 이동
    context:
      position: {x: 0, y: 0, heading: 0}
      sensors:
        lidar: {front: 50, left: 50, right: 50, obstacles_detected: 0}
      mission: {type: waypoint_navigation, progress: 0}
    user_command: "앞에 있는 웨이포인트로 가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: waypoint, index: current}
        speed: normal
    variations:
      - "웨이포인트로 이동해"
      - "다음 지점으로 가줘"
      - "목표 지점까지 가"

  - id: nav_002
    name: GPS 좌표 이동
    context:
      position: {x: -520, y: 180, heading: 45}
      sensors:
        lidar: {front: 30, left: 25, right: 35, obstacles_detected: 0}
      mission: {type: free_navigation}
    user_command: "위도 -33.722, 경도 150.674로 가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: gps, lat: -33.722, lon: 150.674}
        speed: normal
    variations:
      - "GPS 좌표 (-33.722, 150.674)로 이동"
      - "해당 GPS 위치로 가줘"

  - id: nav_003
    name: 로컬 좌표 이동
    context:
      position: {x: 0, y: 0, heading: 90}
      sensors:
        lidar: {front: 40, left: 40, right: 40, obstacles_detected: 0}
    user_command: "좌표 (100, 50)으로 이동해"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: local, x: 100, y: 50}
        speed: normal

  - id: nav_004
    name: 상대 거리 이동
    context:
      position: {x: 10, y: 10, heading: 0}
      sensors:
        lidar: {front: 50, left: 50, right: 50, obstacles_detected: 0}
    user_command: "앞으로 20미터 가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: relative, forward: 20}
        speed: normal
    variations:
      - "전방 20m 이동"
      - "20미터 직진해"

  - id: nav_005
    name: 빠른 속도 이동
    context:
      position: {x: 0, y: 0, heading: 0}
      sensors:
        lidar: {front: 50, left: 50, right: 50, obstacles_detected: 0}
    user_command: "빨리 웨이포인트로 가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: waypoint, index: current}
        speed: fast
    variations:
      - "최대 속도로 이동해"
      - "급하니까 빨리 가"

  # === 방향 전환 (5개) ===
  - id: nav_006
    name: 좌회전
    context:
      position: {x: 0, y: 0, heading: 0}
      sensors:
        lidar: {front: 10, left: 50, right: 50, obstacles_detected: 1}
    user_command: "왼쪽으로 돌아"
    expected_output:
      tool: kaboat_turn
      parameters:
        direction: left
        angle: 90

  - id: nav_007
    name: 우회전
    context:
      position: {x: 0, y: 0, heading: 0}
      sensors:
        lidar: {front: 10, left: 50, right: 50, obstacles_detected: 1}
    user_command: "오른쪽으로 90도 회전"
    expected_output:
      tool: kaboat_turn
      parameters:
        direction: right
        angle: 90

  - id: nav_008
    name: 유턴
    context:
      position: {x: 0, y: 0, heading: 0}
    user_command: "뒤로 돌아"
    expected_output:
      tool: kaboat_turn
      parameters:
        direction: left
        angle: 180
    variations:
      - "유턴해"
      - "180도 회전"

  - id: nav_009
    name: 특정 방향 정렬
    context:
      position: {x: 0, y: 0, heading: 45}
    user_command: "북쪽을 향해"
    expected_output:
      tool: kaboat_align_heading
      parameters:
        target_heading: 90  # ENU: North = 90°

  - id: nav_010
    name: 목표물 방향 정렬
    context:
      position: {x: 0, y: 0, heading: 0}
      vision:
        detected_objects:
          - {type: buoy, color: red, distance: 20, bearing: 30}
    user_command: "빨간 부표를 향해 정렬해"
    expected_output:
      tool: kaboat_align_to_object
      parameters:
        target: {type: buoy, color: red}

  # === 경로 추종 (5개) ===
  - id: nav_011
    name: 직선 경로 추종
    context:
      position: {x: 0, y: 0, heading: 0}
      mission:
        type: path_following
        path: [{x: 0, y: 0}, {x: 50, y: 0}, {x: 100, y: 0}]
    user_command: "경로를 따라 이동해"
    expected_output:
      tool: kaboat_follow_path
      parameters:
        mode: strict
        speed: normal

  - id: nav_012
    name: 웨이포인트 순회
    context:
      mission:
        type: hopping_tour
        waypoints: [wp1, wp2, wp3]
        current_index: 0
    user_command: "웨이포인트들을 순서대로 돌아"
    expected_output:
      tool: kaboat_execute_mission
      parameters:
        mission_type: hopping_tour
        hold_time: 3

  - id: nav_013
    name: 다음 웨이포인트로
    context:
      mission:
        type: hopping_tour
        current_index: 1
        total: 5
    user_command: "다음 웨이포인트로 넘어가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: waypoint, index: next}
        speed: normal

  - id: nav_014
    name: 이전 웨이포인트로 복귀
    context:
      mission:
        type: hopping_tour
        current_index: 3
    user_command: "이전 웨이포인트로 돌아가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: waypoint, index: previous}
        speed: normal

  - id: nav_015
    name: 시작점 복귀
    context:
      position: {x: 50, y: 30, heading: 180}
      mission:
        start_position: {x: 0, y: 0}
    user_command: "시작점으로 돌아가"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: home}
        speed: normal
    variations:
      - "홈으로 복귀"
      - "원점으로 가"

  # === 속도 제어 (5개) ===
  - id: nav_016
    name: 속도 증가
    context:
      position: {x: 0, y: 0, heading: 0}
      current_speed: slow
    user_command: "속도 올려"
    expected_output:
      tool: kaboat_set_speed
      parameters:
        speed: normal
    variations:
      - "더 빨리 가"
      - "가속해"

  - id: nav_017
    name: 속도 감소
    context:
      current_speed: fast
    user_command: "천천히 가"
    expected_output:
      tool: kaboat_set_speed
      parameters:
        speed: slow
    variations:
      - "속도 줄여"
      - "감속해"

  - id: nav_018
    name: 정지
    context:
      current_speed: normal
    user_command: "멈춰"
    expected_output:
      tool: kaboat_stop
      parameters: {}
    variations:
      - "정지"
      - "스탑"

  - id: nav_019
    name: 최대 속도
    context:
      sensors:
        lidar: {front: 50, obstacles_detected: 0}
    user_command: "최대 속도로 가"
    expected_output:
      tool: kaboat_set_speed
      parameters:
        speed: turbo

  - id: nav_020
    name: 미세 속도 조절
    context: {}
    user_command: "아주 천천히 가"
    expected_output:
      tool: kaboat_set_speed
      parameters:
        speed: crawl

  # === 복합 명령 (5개) ===
  - id: nav_021
    name: 이동 후 대기
    context:
      position: {x: 0, y: 0}
    user_command: "웨이포인트 가서 5초 대기해"
    expected_output:
      tool: kaboat_navigate_and_hold
      parameters:
        target: {type: waypoint, index: current}
        hold_time: 5

  - id: nav_022
    name: 이동 후 회전
    context: {}
    user_command: "앞으로 10미터 가고 왼쪽으로 돌아"
    expected_output:
      tool: kaboat_sequence
      parameters:
        actions:
          - {tool: kaboat_navigate_to, params: {target: {type: relative, forward: 10}}}
          - {tool: kaboat_turn, params: {direction: left, angle: 90}}

  - id: nav_023
    name: 후진
    context:
      sensors:
        lidar: {front: 3, back: 50}
    user_command: "뒤로 가"
    expected_output:
      tool: kaboat_move_backward
      parameters:
        distance: 5
        speed: slow

  - id: nav_024
    name: 측면 이동 (crab)
    context: {}
    user_command: "왼쪽으로 5미터 횡이동"
    expected_output:
      tool: kaboat_navigate_to
      parameters:
        target: {type: relative, left: 5}
        speed: slow

  - id: nav_025
    name: 정밀 위치 조정
    context:
      position: {x: 49.5, y: 0.3}
      target: {x: 50, y: 0}
    user_command: "정확히 목표 위치에 맞춰"
    expected_output:
      tool: kaboat_fine_adjust
      parameters:
        target: {x: 50, y: 0}
        tolerance: 0.5
